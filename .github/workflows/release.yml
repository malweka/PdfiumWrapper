name: Release and Publish to NuGet

on:
  workflow_dispatch:

permissions:
  contents: write   # required to create tags and releases

jobs:
  guard:
    name: Ensure release/* branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Verify branch
        run: |
          case "$GITHUB_REF_NAME" in
            release/*) echo "OK: running from $GITHUB_REF_NAME" ;;
            *) echo "::error::This workflow may only run from a release/* branch (got $GITHUB_REF_NAME)"; exit 1 ;;
          esac

      - name: Extract version from branch name
        id: extract_version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

  pack-runtimes:
    name: Pack runtime (${{ matrix.rid }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack PdfiumWrapper.runtime.${{ matrix.rid }}
        run: |
          dotnet pack src/PdfiumWrapper.runtime/PdfiumWrapper.runtime.csproj \
            --configuration Release \
            --output ./artifacts \
            /p:NativeRid=${{ matrix.rid }} \
            /p:Version=${{ needs.guard.outputs.version }}

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-runtime-${{ matrix.rid }}
          path: ./artifacts/*.nupkg

  release:
    name: Pack main, Publish, and Release
    needs: [guard, pack-runtimes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink can embed commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download runtime packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nupkg-runtime-*
          merge-multiple: true

      # The main package depends on the four runtime packages packed above (see
      # PackRuntimeDependencies in PdfiumWrapper.csproj); restore them from ./artifacts.
      - name: Restore main package
        run: |
          dotnet restore src/PdfiumWrapper/PdfiumWrapper.csproj \
            --source ./artifacts \
            --source https://api.nuget.org/v3/index.json \
            /p:PackRuntimeDependencies=true \
            /p:Version=${{ needs.guard.outputs.version }}

      - name: Build main package
        run: |
          dotnet build src/PdfiumWrapper/PdfiumWrapper.csproj \
            --configuration Release \
            --no-restore \
            /p:PackRuntimeDependencies=true \
            /p:Version=${{ needs.guard.outputs.version }} \
            /p:FileVersion=${{ needs.guard.outputs.version }} \
            /p:AssemblyVersion=${{ needs.guard.outputs.version }}

      - name: Pack main package (+ symbols)
        run: |
          dotnet pack src/PdfiumWrapper/PdfiumWrapper.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:PackRuntimeDependencies=true \
            /p:Version=${{ needs.guard.outputs.version }} \
            /p:FileVersion=${{ needs.guard.outputs.version }} \
            /p:AssemblyVersion=${{ needs.guard.outputs.version }}

      - name: Verify the main package depends on every runtime package
        run: |
          VERSION=${{ needs.guard.outputs.version }}
          NUSPEC=$(unzip -p "artifacts/PdfiumWrapper.$VERSION.nupkg" PdfiumWrapper.nuspec)
          for RID in win-x64 linux-x64 osx-x64 osx-arm64; do
            echo "$NUSPEC" | grep -qF "id=\"PdfiumWrapper.runtime.$RID\" version=\"[$VERSION]\"" \
              || { echo "PdfiumWrapper.$VERSION.nupkg lacks a dependency on PdfiumWrapper.runtime.$RID [$VERSION]"; exit 1; }
          done

      - name: Build and pack PdfiumWrapper.Processing (+ symbols)
        run: |
          dotnet build src/PdfiumWrapper.Processing/PdfiumWrapper.Processing.csproj \
            --configuration Release \
            /p:Version=${{ needs.guard.outputs.version }} \
            /p:FileVersion=${{ needs.guard.outputs.version }} \
            /p:AssemblyVersion=${{ needs.guard.outputs.version }}
          dotnet pack src/PdfiumWrapper.Processing/PdfiumWrapper.Processing.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:Version=${{ needs.guard.outputs.version }} \
            /p:FileVersion=${{ needs.guard.outputs.version }} \
            /p:AssemblyVersion=${{ needs.guard.outputs.version }}

      - name: Push all packages to NuGet (main + processing + runtimes + symbols)
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create tag and GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          name: v${{ needs.guard.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
