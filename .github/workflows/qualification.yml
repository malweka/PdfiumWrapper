name: Pool qualification

# Manual qualification of PdfiumWrapper.Processing (ai/plans/plan-pool-qualification.md): a
# self-contained publish of src/PdfiumWrapper.Qualification, which is its own worker, then a burst
# and a soak on win-x64 and linux-x64 and a smoke run on osx-arm64. Reports are uploaded as
# artifacts and shown in the run summary. Exit code 2 (growth above 10%, nothing else wrong) marks
# the step failed too: the reports say which.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs in the burst'
        type: number
        default: 10000
      minutes:
        description: 'Soak duration in minutes'
        type: number
        default: 30

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            runs: full
          - os: windows-latest
            rid: win-x64
            runs: full
          - os: macos-latest
            rid: osx-arm64
            runs: smoke
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the harness (self-contained)
        run: |
          dotnet publish src/PdfiumWrapper.Qualification/PdfiumWrapper.Qualification.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output "$RUNNER_TEMP/qualification"

      - name: Smoke
        if: matrix.runs == 'smoke'
        run: |
          "$RUNNER_TEMP/qualification/PdfiumWrapper.Qualification" smoke \
            --work "$RUNNER_TEMP/smoke" --report "$RUNNER_TEMP/reports/smoke-${{ matrix.rid }}.json"

      - name: Burst (${{ inputs.jobs }} jobs)
        if: matrix.runs == 'full'
        run: |
          "$RUNNER_TEMP/qualification/PdfiumWrapper.Qualification" burst --jobs ${{ inputs.jobs }} \
            --work "$RUNNER_TEMP/burst" --report "$RUNNER_TEMP/reports/burst-${{ matrix.rid }}.json"

      - name: Soak (${{ inputs.minutes }} minutes)
        if: matrix.runs == 'full' && !cancelled()
        run: |
          "$RUNNER_TEMP/qualification/PdfiumWrapper.Qualification" soak --minutes ${{ inputs.minutes }} \
            --work "$RUNNER_TEMP/soak" --report "$RUNNER_TEMP/reports/soak-${{ matrix.rid }}.json"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.rid }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn
